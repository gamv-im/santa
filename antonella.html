<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antonella</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: sans-serif; }
  video { width: 100%; height: 100%; object-fit: contain; }
  #playBtn {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
    justify-content: center; align-items: center;
    background: rgba(0,0,0,0.4); cursor: pointer; z-index: 10;
  }
  .circulo {
    width: 90px; height: 90px; background: white; border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    font-size: 38px; padding-left: 6px;
  }
  .texto { color: white; font-size: 18px; font-weight: bold; }
</style>
</head>
<body>

  <video id="video" playsinline controls preload="metadata" src="antonella.mp4"></video>

  <div id="playBtn" onclick="reproducir()">
    <div class="circulo">▶️</div>
    <div class="texto">Antonella - Toca para reproducir</div>
  </div>

  <script>
    function reproducir() {
      var v = document.getElementById('video');
      v.play();
      document.getElementById('playBtn').style.display = 'none';
    }
    // Si ponen pausa, vuelve a aparecer el botón
    document.getElementById('video').addEventListener('pause', function() {
      document.getElementById('playBtn').style.display = 'flex';
    });
  </script>

</body>
</html>
